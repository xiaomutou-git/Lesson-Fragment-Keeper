<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>教案碎片收纳盒</title>
  <!-- 内联 SVG 粉笔图标作为 favicon，避免本地打开时出现 404 请求 -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='2.5' y='1' width='11' height='14' rx='2' fill='%23a2402c'/%3E%3Crect x='4.5' y='3' width='7' height='10' fill='%23faf4e3'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ============ 顶部栏 ============ -->
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <!-- 品牌图标：档案盒 -->
        <svg class="brand-icon" viewBox="0 0 48 48" aria-hidden="true">
          <rect x="6" y="12" width="36" height="26" rx="3" fill="#a2402c"/>
          <rect x="6" y="18" width="36" height="20" rx="3" fill="#faf4e3"/>
          <rect x="10" y="23" width="28" height="3" fill="#c6b689"/>
          <rect x="10" y="29" width="18" height="3" fill="#c6b689"/>
        </svg>
        <div class="brand-text">
          <h1>教案碎片收纳盒</h1>
          <p>备课素材的轻量收纳 · 数据只存本机</p>
        </div>
      </div>
      <div class="topbar-actions">
        <div class="stat" id="stat">共 0 条素材 · 0 个标签 · 累计 0 字</div>
        <!-- 数据备份：导出 / 导入本地 JSON 备份 -->
        <button class="btn btn-mini" id="exportDataBtn" type="button">导出数据</button>
        <button class="btn btn-mini" id="importDataBtn" type="button">导入数据</button>
        <button class="btn btn-primary" id="exportBtn" type="button">导出选中为 Markdown</button>
      </div>
    </div>
  </header>

  <main class="main">

    <!-- ============ 素材录入区 ============ -->
    <section class="composer" aria-label="素材录入">
      <div class="composer-main">
        <textarea id="fragmentInput" maxlength="1000"
          placeholder="记录一条备课素材：一段教学灵感、一个课堂问题、一句学生精彩回答……&#10;（Ctrl / ⌘ + Enter 快速收入）"></textarea>
        <div class="composer-foot">
          <div class="tag-picker">
            <span class="picker-label">标签</span>
            <div class="picker-tags" id="pickerTags"></div>
            <button class="btn btn-mini" id="pickerTagNew" type="button">＋ 新建标签</button>
          </div>
          <div class="composer-actions">
            <button class="btn btn-text edit-tip hidden" id="cancelEditBtn" type="button">取消编辑</button>
            <span class="char-count" id="charCount">0 / 1000</span>
            <button class="btn btn-primary" id="addBtn" type="button">收入盒中</button>
          </div>
        </div>
      </div>
    </section>

    <!-- ============ 工作区 ============ -->
    <div class="workspace">
      <!-- 左侧标签栏 -->
      <aside class="sidebar" aria-label="标签分类">
        <div class="sidebar-head">素材分类</div>
        <ul class="tag-list" id="tagList">
          <li class="tag-item active" data-filter="all" role="button" tabindex="0">
            <span class="tag-name">全部素材</span>
            <span class="tag-count" id="countAll">0</span>
          </li>
        </ul>
        <button class="btn-text side-new-tag" id="newTagBtn" type="button">＋ 新建标签</button>
      </aside>

      <!-- 右侧素材列表 -->
      <section class="content" aria-label="素材列表">
        <div class="list-head">
          <div class="list-title" id="listTitle">全部素材</div>
          <div class="list-tools">
            <label class="select-all"><input type="checkbox" id="selectAll"> 全选</label>
            <button class="btn-text danger" id="deleteSelectedBtn" type="button">删除选中</button>
          </div>
        </div>
        <!-- 素材搜索框：对内容做实时过滤，与标签筛选叠加 -->
        <div class="search-bar">
          <input type="text" id="searchInput" placeholder="搜索素材内容…" autocomplete="off">
          <button class="btn-text search-clear hidden" id="searchClear" type="button">清空</button>
        </div>
        <div class="hint-bar">拖动卡片左侧 <i class="drag-dots">⋮⋮</i> 可调整顺序</div>
        <div class="list" id="fragmentList"></div>
      </section>
    </div>
  </main>

  <!-- ============ 右下角粉笔彩蛋入口 ============ -->
  <div class="chalk" id="chalk" role="button" tabindex="0" aria-label="教师节小彩蛋">
    <!-- 粉笔 SVG -->
    <svg viewBox="0 0 64 64" aria-hidden="true">
      <g transform="rotate(28 32 32)">
        <rect x="27" y="4" width="10" height="56" rx="5" fill="#f4ead3" stroke="#c6b689" stroke-width="1.5"/>
        <rect x="27" y="4" width="10" height="14" rx="5" fill="#e6d8b8"/>
        <circle cx="32" cy="34" r="1.6" fill="#a2402c" opacity="0.85"/>
      </g>
    </svg>
    <span class="chalk-tip">教师节的小彩蛋</span>
  </div>

  <!-- ============ 标签新增 / 重命名弹窗 ============ -->
  <div class="modal hidden" id="tagModal" role="dialog" aria-modal="true">
    <div class="modal-mask" data-close></div>
    <div class="modal-card">
      <h3 id="tagModalTitle">新建标签</h3>
      <input id="tagNameInput" maxlength="12" placeholder="标签名称（12 字以内）" autocomplete="off">
      <div class="modal-actions">
        <button class="btn" type="button" data-close>取消</button>
        <button class="btn btn-primary" id="tagModalOk" type="button">保存</button>
      </div>
    </div>
  </div>

  <!-- ============ 通用确认弹窗 ============ -->
  <div class="modal hidden" id="confirmModal" role="dialog" aria-modal="true">
    <div class="modal-mask" data-close></div>
    <div class="modal-card">
      <h3 id="confirmTitle">确认操作</h3>
      <p id="confirmMsg"></p>
      <div class="modal-actions">
        <button class="btn" type="button" data-close>取消</button>
        <button class="btn btn-primary danger" id="confirmOk" type="button">确定</button>
      </div>
    </div>
  </div>

  <!-- ============ 导出 Markdown 预览弹窗 ============ -->
  <div class="modal hidden" id="exportModal" role="dialog" aria-modal="true">
    <div class="modal-mask" data-close></div>
    <div class="modal-card export">
      <h3>导出选中素材</h3>
      <div class="export-hint" id="exportHint"></div>
      <!-- 可编辑的 Markdown 预览区，用户可自行修改后再复制 -->
      <textarea id="exportTextarea" spellcheck="false"></textarea>
      <div class="modal-actions">
        <button class="btn" type="button" data-close>关闭</button>
        <button class="btn" id="exportWordBtn" type="button">下载 Word (.doc)</button>
        <button class="btn btn-primary" id="exportCopyBtn" type="button">复制到剪贴板</button>
      </div>
    </div>
  </div>

  <!-- ============ 教师节祝福弹窗 ============ -->
  <div class="modal hidden" id="greetModal" role="dialog" aria-modal="true">
    <div class="modal-mask" data-close></div>
    <div class="modal-card greet">
      <!-- 祝福页眉：一根斜放的大粉笔 -->
      <div class="greet-chalk">
        <svg viewBox="0 0 72 72" aria-hidden="true">
          <g transform="rotate(26 36 36)">
            <rect x="31" y="4" width="10" height="64" rx="5" fill="#f4ead3" stroke="#c6b689" stroke-width="1.5"/>
            <rect x="31" y="4" width="10" height="16" rx="5" fill="#e6d8b8"/>
            <path d="M31 26 q5 -3 10 0 l0 8 q-5 -3 -10 0 z" fill="#a2402c" opacity="0.7"/>
          </g>
        </svg>
      </div>
      <h3 class="greet-title">教师节快乐</h3>
      <div class="greet-date">2026 · 九月十日</div>
      <div class="greet-body">
        <p>敬爱的老师：</p>
        <p>粉笔灰落在袖口，<br>教案纸写尽深夜，<br>您把每一片零碎的想法，<br>都拼成了课堂上的光。</p>
        <p>愿这个小盒子，<br>帮您少花一点时间整理；<br>也愿您的每一天，<br>都被温柔以待。</p>
      </div>
      <div class="modal-actions">
        <button class="btn btn-primary" type="button" data-close>收下这份祝福</button>
      </div>
    </div>
  </div>

  <!-- ============ 轻提示 ============ -->
  <div class="toast hidden" id="toast" role="status"></div>

  <!-- 数据导入的文件选择框（隐藏） -->
  <input type="file" id="importFile" accept=".json,application/json" class="hidden">

  <!-- 先加载纯转换模块（提供全局 MarkdownExport），再加载应用逻辑 -->
  <script src="markdown-export.js"></script>
  <script src="app.js"></script>
</body>
</html>
